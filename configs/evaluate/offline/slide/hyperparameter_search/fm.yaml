method: fm
task: slide
protocol:
  seeds: [1, 2, 3, 4, 5]
  samples_per_checkpoint: 100
  include_current_checkpoint: true
  sampling_seed: 0
  mc_seed: 0
  global_seed: 0
  kappa: 0.9
  mc_samples: 10000
  mc_repeats: 5
  legacy_kde_direct_search_target: false
fixed:
  hidden_layer_sizes: [16, 16]
  structure_adjustment_note: "现行历史 FM evaluator 默认是 [32,32,32]；本阶段按师兄意见固定为 [16,16]，待人工确认后方可接入正式配置。"
stages:
  screening:
    seeds: [1, 3, 5]
    checkpoints: representative
    mc_samples: 256
    mc_repeats: 1
    max_candidates: 8
  validation:
    seeds: [1, 2, 3, 4, 5]
    checkpoints: all
    mc_samples: 10000
    mc_repeats: 5
    top_k: 5
search_space:
  n_members: [1, 3]
  n_epochs: [100, 300]
  samples_per_epoch: [512, 2048]
  lr: [1.0e-3, 3.0e-4]
  weight_decay: [0.0, 1.0e-5]
  noise_std: [0.0, 0.01]
  ode_steps: [16, 32]
  likelihood_batch_size: [256, 1024]
  patience: [20, 50]
