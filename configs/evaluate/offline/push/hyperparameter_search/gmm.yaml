method: gmm
task: push
protocol:
  seeds: [1, 2, 3, 4, 5]
  samples_per_checkpoint: 100
  include_current_checkpoint: true
  sampling_seed: 0
  mc_seed: 0
  global_seed: 0
  kappa: 0.9
  mc_samples: 10000
  mc_repeats: 5
  legacy_kde_direct_search_target: false
fixed: {resample_size: 1000}
stages:
  screening: {seeds: [1, 3, 5], checkpoints: representative, mc_samples: 256, mc_repeats: 1, max_candidates: 8}
  validation: {seeds: [1, 2, 3, 4, 5], checkpoints: all, mc_samples: 10000, mc_repeats: 5, top_k: 5}
search_space:
  n_components: [2, 5]
  covariance_type: [full, diag]
  reg_covar: [1.0e-6, 1.0e-4]
  max_iter: [100, 300]
  tol: [1.0e-3, 1.0e-4]
  n_init: [1, 3]
